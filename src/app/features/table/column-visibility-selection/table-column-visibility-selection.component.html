<button (click)="isSelectionOpen.set(!this.isSelectionOpen())">Настройки</button>

@if (isSelectionOpen()) {
  <div class="wrapper">
    @for (columns of columnList(); track columns[0]) {
      <div class="checkbox">
        <input type="checkbox" class="checkbox-input" [formField]="columns[1]" />
        <p class="checkbox-text">{{ columnNames()[columns[0]] }}</p>
      </div>
    }
  </div>
}
